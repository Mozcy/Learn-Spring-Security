server:
  port: 8080  # 项目运行端口

spring:
  application:
    name: Spring Security # 项目运行名称
  # redis连接配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:
      database: 0
  # 数据库源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring_security?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    # 数据库连接池配置
    druid:
      min-idle: 5                           # 连接池中最小的空闲连接数，保持 5 个空闲连接
      max-active: 20                        # 连接池最大活跃连接数，最多支持 20 个连接
      max-wait: 60000                       # 获取连接的最大等待时间，单位毫秒，60000ms = 60 秒
      initial-size: 5                       # 初始化连接池时的连接数，启动时创建 5 个连接
      connectTimeout: 30000                 # 建立数据库连接的超时时间，30000ms = 30 秒
      socketTimeout: 60000                  # Socket 读取数据的超时时间，60000ms = 60 秒
      timeBetweenEvictionRunsMillis: 60000  # 检测空闲连接的周期，60000ms = 60 秒，定期检查连接是否可用
      minEvictableIdleTimeMillis: 300000    # 连接在池中最小存活时间，300000ms = 5 分钟，超过此时间可能被回收
      validationQuery: SELECT 1 FROM DUAL   # 验证连接是否有效的 SQL 语句，MySQL 下可以用 SELECT 1
      testWhileIdle: true                   # 在空闲时检查连接有效性，使用 validationQuery 验证
      testOnBorrow: false                   # 获取连接时不检查有效性（false 提高性能）
      testOnReturn: false                   # 归还连接时不检查有效性（false 提高性能）
      poolPreparedStatements: true          # 开启 PreparedStatement 缓存，提升性能
      maxPoolPreparedStatementPerConnectionSize: 20 # 每个连接缓存的 PreparedStatement 数量上限
      filters: stat,slf4j                   # 配置 Druid 过滤器, stat: 启用监控统计功能, lf4j: 将日志输出到 SLF4J, 便于集成日志框架
      connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000 # druid.stat.mergeSql=true：合并统计相同 SQL 的执行情况, druid.stat.slowSqlMillis=5000：慢 SQL 的阈值，执行超过 5 秒的 SQL 会被记录

# mybatis-plus配置
mybatis-plus:
  # 配置别名包路径，扫描实体类所在包
  # 比如实体类在 sbs.getcry 包及其子包下，XML 文件中可直接使用类名（如 User）而无需全限定名
  typeAliasesPackage: sbs.getcry.**

  # 配置 Mapper XML 文件的路径
  # classpath:mapper/**/*.xml 表示扫描 classpath 下 mapper 目录及其子目录下的所有 .xml 文件
  # 用于存放 SQL 映射文件，与 Mapper 接口对应
  mapper-locations: classpath:mapper/**/*.xml

  # 全局数据库配置
  # global-config:
    # db-config:
      # 主键类型，默认 AUTO 表示自增（适用于 MySQL 的 AUTO_INCREMENT）
      # 可选值：UUID（生成 UUID）、INPUT（手动输入）
      #id-type: AUTO

      # 表名前缀，比如配置为 xxx_，则实体类 User 映射到表 xxx_user
      #table-prefix: xxx_

      # 逻辑删除字段的删除值，配置为 1 表示删除状态为 1
      #logic-delete-value: 1

      # 逻辑删除字段的未删除值，配置为 0 表示未删除状态为 0
      #logic-not-delete-value: 0

      # 逻辑删除的字段名，比如 deleted 配合上述值实现逻辑删除功能
      # 结合 logic-delete-value 和 logic-not-delete-value 的值来确认过滤条件
      #logic-delete-field: deleted

      # 字段更新策略，默认 NOT_NULL 表示只更新非空字段
      # 可选值：IGNORED（忽略校验）、NOT_EMPTY（非空字符串）
      #field-strategy: NOT_NULL

  # MyBatis-Plus 的底层 MyBatis 配置
  configuration:
    map-underscore-to-camel-case: true # 开启下划线转驼峰映射, 例: 数据库中 user_name 映射到实体类 userName, 默认 true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl     # 配置日志实现类，StdOutImpl 表示将 SQL 日志输出到控制台, 生产环境可改为 SLF4J 或其他日志框架
